<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Events">
<title>Event Picker</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#0a66c2;--accbg:#e8f1fb;--sel:#fff8e1;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececef;--mute:#9a9aa1;--line:#2e2e33;--acc:#5aa9ff;--accbg:#1b2a3d;--sel:#2b2614;--warn:#f79009}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.dates{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dates label{font-size:13px;color:var(--mute)}
input[type=search],input[type=date],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1 1 220px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:5px 10px;font-size:13px}
main{max-width:900px;margin:0 auto;padding:8px 16px 110px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:22px 0 8px}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.ev.on{background:var(--sel);border-color:var(--acc)}
.ev input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--acc)}
.body{min-width:0;flex:1}
.name{font-weight:600;font-size:16px}
.row{margin-top:3px;color:var(--mute);font-size:14px}
.row b{color:var(--ink);font-weight:500}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.links{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.links a{font-size:13px;background:var(--accbg);padding:2px 8px;border-radius:6px}
.desc{margin-top:6px;font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.warn{color:var(--warn);font-size:13px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bar .count{margin-right:auto;font-weight:600}
button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.empty{color:var(--mute);text-align:center;padding:40px 0}
@media (max-width:600px){
  header{position:static}
  .dates{width:100%;flex-wrap:nowrap}
  .dates input{flex:1;min-width:0;padding:7px 6px}
  .controls select{flex:1 1 30%;min-width:0}
}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:90vw;display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Event Picker</h1>
    <div class="sub"><span id="updated">Loading…</span> · <a id="refresh" href="#" target="_blank" rel="noopener">Refresh now</a></div>
  </div>
  <div id="warn"></div>
  <div class="controls">
    <div class="dates">
      <label for="from">From</label><input type="date" id="from">
      <label for="to">to</label><input type="date" id="to">
    </div>
    <div class="quick">
      <button data-q="weekend">This weekend</button>
      <button data-q="7">Next 7 days</button>
      <button data-q="21">Next 3 weeks</button>
    </div>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search name, venue, host…">
    <select id="town"><option value="">All towns</option></select>
    <select id="src"><option value="">All sources</option></select>
    <select id="show"><option value="">Show all</option><option value="sel">Only selected</option></select>
  </div>
  <div class="sub" id="shown" style="margin-top:8px"></div>
</header>
<main id="list"><div class="empty">Loading events…</div></main>
<div class="bar">
  <span class="count" id="count">0 selected</span>
  <button id="clear">Clear</button>
  <button id="add" class="primary">Add to Calendar</button>
</div>
<div class="toast" id="toast"></div>
<script>
const TZ = "America/Los_Angeles";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let DATA = {events: [], warnings: []};
const sel = new Set(store.get("selected", []));

const ymd = new Intl.DateTimeFormat("en-CA",{timeZone:TZ});          // 2026-11-19
const fmtDay = new Intl.DateTimeFormat("en-US",{timeZone:"UTC",weekday:"long",month:"long",day:"numeric"});
const fmtTime = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});
const fmtDate = new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"short",day:"numeric"});
const fmtStamp = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const today = () => ymd.format(new Date());
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };
const dayKey = e => e.allDay ? e.start.slice(0,10) : ymd.format(new Date(e.start));
const dayLabel = k => fmtDay.format(new Date(k + "T12:00:00Z"));
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function when(e){
  if(e.allDay) return "All day";
  let t = fmtTime.format(new Date(e.start));
  if(e.end){ const en = new Date(e.end);
    t += " – " + (ymd.format(en) !== dayKey(e) ? fmtDate.format(en) + " " : "") + fmtTime.format(en); }
  else t += " (end time not listed)";
  return t;
}
function ended(e){
  const now = new Date();
  if(e.allDay) return e.start.slice(0,10) < today();
  return new Date(e.end || e.start) < now;
}

// "Refresh now" goes to the GitHub Actions page that has the Run workflow button.
(function(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  if(m && repo) $("refresh").href = `https://github.com/${m[1]}/${repo}/actions/workflows/update.yml`;
  else $("refresh").style.display = "none";
})();

function setRange(from, to){ $("from").value = from; $("to").value = to; store.set("range", [from, to]); render(); }
document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
  const t = today(), q = b.dataset.q;
  if(q === "weekend"){
    const dow = new Date(t + "T12:00:00Z").getUTCDay();          // 0 Sun … 6 Sat
    if(dow === 6) setRange(t, addDays(t, 1));
    else if(dow === 0) setRange(t, t);
    else { const fri = addDays(t, 5 - dow); setRange(fri, addDays(fri, 2)); }
  } else setRange(t, addDays(t, +q));
});

async function load(){
  try{
    const r = await fetch("events.json", {cache: "no-cache"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  }catch(err){
    $("list").innerHTML = `<div class="empty">Couldn't load events (${esc(err.message)}). Try reloading.</div>`;
    $("updated").textContent = "Not loaded"; return;
  }
  $("updated").textContent = "Updated " + fmtStamp.format(new Date(DATA.generated));
  $("warn").innerHTML = (DATA.warnings||[]).map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("");
  [...new Set(DATA.events.map(e => e.town).filter(Boolean))].sort().forEach(t => $("town").add(new Option(t, t)));
  [...new Set(DATA.events.flatMap(e => e.sources))].sort().forEach(s => $("src").add(new Option(s, s)));
  // forget selections for events that are gone or over
  const live = new Set(DATA.events.filter(e => !ended(e)).map(e => e.id));
  [...sel].forEach(id => { if(!live.has(id)) sel.delete(id); });
  const saved = store.get("range", null), t = today();
  const from = saved && saved[0] >= t ? saved[0] : t;
  const to = saved && saved[1] >= from ? saved[1] : addDays(from, 21);
  $("from").value = from; $("to").value = to;
  const last = DATA.events.length ? dayKey(DATA.events[DATA.events.length-1]) : t;
  $("from").min = $("to").min = t; $("from").max = $("to").max = last;
  render();
}
["from","to"].forEach(id => $(id).addEventListener("change", () => {
  if($("to").value && $("from").value > $("to").value) $("to").value = $("from").value;
  store.set("range", [$("from").value, $("to").value]); render();
}));
["q","town","src","show"].forEach(id => $(id).addEventListener("input", render));

function render(){
  const from = $("from").value || today(), to = $("to").value || "9999";
  const q = $("q").value.trim().toLowerCase(), town = $("town").value, src = $("src").value, only = $("show").value === "sel";
  const rows = DATA.events.filter(e => {
    const k = dayKey(e);
    return k >= from && k <= to && !ended(e) && (!town || e.town === town) && (!src || e.sources.includes(src))
      && (!only || sel.has(e.id))
      && (!q || [e.name, e.venue, e.host, e.address, e.description].join(" ").toLowerCase().includes(q));
  });
  let html = "", last = "";
  for(const e of rows){
    const k = dayKey(e); if(k !== last){ html += `<h2>${dayLabel(k)}</h2>`; last = k; }
    const place = [e.venue, e.address].filter(Boolean).join(", ");
    const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place);
    html += `<label class="ev${sel.has(e.id) ? " on" : ""}" data-id="${esc(e.id)}">
      <input type="checkbox"${sel.has(e.id) ? " checked" : ""}>
      <div class="body">
        <div class="name">${esc(e.name)}</div>
        <div class="row"><b>${when(e)}</b></div>
        <div class="row">${place ? `<a href="${maps}" target="_blank" rel="noopener">${esc(place)}</a>` : "Location not listed"}</div>
        <div class="row">Host: ${e.host ? esc(e.host) : "not listed"}</div>
        ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
        <div class="links">${e.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
      </div></label>`;
  }
  $("list").innerHTML = html || `<div class="empty">No events match.</div>`;
  $("shown").textContent = `${rows.length} events shown`;
  updateBar();
}

$("list").addEventListener("change", ev => {
  const card = ev.target.closest(".ev"); if(!card) return;
  const id = card.dataset.id; ev.target.checked ? sel.add(id) : sel.delete(id);
  card.classList.toggle("on", ev.target.checked); store.set("selected", [...sel]); updateBar();
});
function updateBar(){
  $("count").textContent = `${sel.size} selected`;
  $("add").disabled = $("clear").disabled = !sel.size;
}
function toast(msg){ const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000); }

// ---- iCalendar ----
const icsText = s => (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const icsUtc = iso => iso.replace(/[-:]/g,"").replace(/\.\d+/,"");
function fold(line){
  const enc = new TextEncoder(); let out = "", cur = "", n = 0;
  for(const ch of line){ const b = enc.encode(ch).length;
    if(n + b > 73){ out += cur + "\r\n "; cur = ""; n = 1; } cur += ch; n += b; }
  return out + cur;
}
function buildICS(events){
  const stamp = icsUtc(new Date().toISOString());
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Event Picker//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(const e of events){
    L.push("BEGIN:VEVENT", `UID:${e.id}@eventpicker`, `DTSTAMP:${stamp}`);
    if(e.allDay){
      const d = e.start.slice(0,10);
      L.push(`DTSTART;VALUE=DATE:${d.replace(/-/g,"")}`, `DTEND;VALUE=DATE:${addDays(d,1).replace(/-/g,"")}`);
    } else {
      L.push(`DTSTART:${icsUtc(e.start)}`); if(e.end) L.push(`DTEND:${icsUtc(e.end)}`);
    }
    const desc = [e.host && ("Host: " + e.host), e.description, ...e.links.map(l => `${l.label}: ${l.url}`)].filter(Boolean).join("\n\n");
    L.push("SUMMARY:" + icsText(e.name));
    const loc = [e.venue, e.address].filter(Boolean).join(", "); if(loc) L.push("LOCATION:" + icsText(loc));
    L.push("DESCRIPTION:" + icsText(desc));
    if(e.links[0]) L.push("URL:" + e.links[0].url);
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n") + "\r\n";
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

$("add").onclick = () => {
  const chosen = DATA.events.filter(e => sel.has(e.id));
  const ics = buildICS(chosen);
  if(isIOS){
    // Safari on iPhone opens calendar data directly and offers "Add All".
    location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type: "text/calendar"}));
  a.download = "events.ics"; document.body.appendChild(a); a.click(); a.remove();
  toast(`Downloaded events.ics (${chosen.length} events). Open it to add them to Calendar.`);
};
$("clear").onclick = () => { sel.clear(); store.set("selected", []); render(); };
load();
</script>
</body>
</html>
